[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-video-agent"
version = "1.0.0"
description = "Autonomous AI video editing system for DaVinci Resolve"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "video-editing", "ai", "davinci-resolve", "computer-vision",
    "beat-detection", "ffmpeg", "whisper", "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ai-video-agent = "main:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ai-video-agent"
Repository = "https://github.com/YOUR_USERNAME/ai-video-agent"
Issues = "https://github.com/YOUR_USERNAME/ai-video-agent/issues"
Changelog = "https://github.com/YOUR_USERNAME/ai-video-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "editor*", "automation*", "config*", "utils*", "mcp*"]

# ─── Ruff (linter) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F401",   # unused imports (many are re-exports)
]

# ─── Mypy (type checking) ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true

# ─── Pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
